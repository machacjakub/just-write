<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JustWrite</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f1f22'/%3E%3Crect x='12' y='10' width='40' height='4' rx='2' fill='%235b8a72'/%3E%3Crect x='12' y='17' width='28' height='4' rx='2' fill='%234a7fc1'/%3E%3Crect x='12' y='24' width='16' height='4' rx='2' fill='%23e0b020'/%3E%3Cpath d='M29 36H49M40 36V46Q40 55 31 55Q23 55 21 48' fill='none' stroke='%23faf8f4' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #faf8f4;
    --fg: #2b2b2b;
    --muted: #9a958c;
    --track: #e4dfd3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1d; --fg: #dcdad5; --muted: #6d6b66; --track: #2e2e32; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  textarea {
    display: block;
    width: 100%;
    max-width: 720px;
    height: 100%;
    margin: 0 auto;
    padding: 12vh 24px 96px;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 1.2rem;
    line-height: 1.7;
    caret-color: var(--fg);
  }
  textarea::placeholder { color: var(--muted); }
  #count {
    position: fixed;
    right: 20px;
    bottom: 16px;
    font: 0.85rem/1 -apple-system, system-ui, sans-serif;
    color: var(--muted);
    user-select: none;
    transition: opacity .3s;
  }
  body.typing #count { opacity: .35; }
  #bars {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    pointer-events: none;
  }
  .bar { height: 5px; background: var(--track); }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    transition: width .3s;
  }
  .bar:not(.show) { display: none; }
  #corner {
    position: fixed;
    left: 20px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    font: 0.85rem/1 -apple-system, system-ui, sans-serif;
    color: var(--muted);
    user-select: none;
  }
  #file:empty { display: none; }
  #icons { display: flex; gap: 8px; }
  #help { position: relative; }
  .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border: 1px solid var(--muted);
    border-radius: 50%;
    font-size: 0.75rem;
    cursor: pointer;
    background: none;
    color: inherit;
    padding: 0;
    font-family: inherit;
  }
  #help > .icon { cursor: help; }
  #help > dl {
    position: absolute;
    left: 0;
    bottom: 26px;
    display: none;
    grid-template-columns: auto auto;
    gap: 6px 16px;
    margin: 0;
    padding: 12px 14px;
    white-space: nowrap;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--track);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
  }
  #help:hover > dl, #help:focus-within > dl { display: grid; }
  #help dt { color: var(--muted); }
  #help dd { margin: 0; }
  #settings {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .25);
    font: 0.9rem/1.3 -apple-system, system-ui, sans-serif;
  }
  #settings.open { display: flex; }
  #settings .card {
    width: min(420px, calc(100vw - 32px));
    padding: 20px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--track);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
  }
  #settings h2 { margin: 0 0 4px; font-size: 1rem; }
  #settings p { margin: 0 0 14px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row span { color: var(--muted); }
  .row input[type=number] {
    width: 90px;
    padding: 5px 8px;
    border: 1px solid var(--track);
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  .row input[type=color] {
    width: 36px;
    height: 28px;
    padding: 0;
    border: 1px solid var(--track);
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }
  #settings button {
    padding: 5px 10px;
    border: 1px solid var(--track);
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #settings button:disabled { opacity: .4; cursor: default; }
  .row .remove { margin-left: auto; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions .close { margin-left: auto; }
</style>
</head>
<body>
<textarea id="editor" placeholder="Start writing…" autofocus spellcheck="true"></textarea>
<div id="bars" aria-hidden="true"></div>
<div id="corner">
  <div id="icons">
    <div id="help" tabindex="0">
      <span class="icon" aria-label="Keyboard shortcuts">?</span>
      <dl>
        <dt>Open file</dt><dd>⌘/Ctrl + O</dd>
        <dt>Save file</dt><dd>⌘/Ctrl + S</dd>
        <dt>Full screen</dt><dd id="fullscreen-key">F11</dd>
      </dl>
    </div>
    <button class="icon" id="settings-btn" aria-label="Settings" title="Settings">⚙</button>
  </div>
  <div id="file"></div>
</div>
<div id="count" aria-live="polite">0 words</div>

<div id="settings" role="dialog" aria-label="Progress bar settings">
  <div class="card">
    <h2>Progress bars</h2>
    <p>Each bar fills up to its word count. The next bar appears once the previous one is full.</p>
    <div id="rows"></div>
    <div class="actions">
      <button id="add">Add bar</button>
      <button id="reset">Reset</button>
      <button class="close" id="close">Done</button>
    </div>
  </div>
</div>

<script>
  const editor = document.getElementById('editor');
  const count = document.getElementById('count');
  const KEY = 'quiet-editor-text';          // draft text (key kept so existing drafts survive the rename)
  const BARS_KEY = 'justwrite-bars';
  const MAX_BARS = 5;
  const DEFAULT_BARS = [
    { to: 800, color: '#5b8a72' },
    { to: 1200, color: '#4a7fc1' },
    { to: 1600, color: '#e0b020' },
  ];
  let idle;

  // --- Progress bars: each bar fills from the previous bar's end up to its own `to`. ---
  const barsEl = document.getElementById('bars');
  let barSettings = loadBars();

  function cleanBars(list) {
    const valid = (Array.isArray(list) ? list : [])
      .filter(b => b && Number.isFinite(+b.to) && +b.to > 0 && /^#[0-9a-f]{6}$/i.test(b.color))
      .map(b => ({ to: Math.round(+b.to), color: b.color }))
      .sort((a, b) => a.to - b.to)
      .filter((b, i, all) => i === 0 || b.to !== all[i - 1].to)
      .slice(0, MAX_BARS);
    return valid.length ? valid : DEFAULT_BARS.map(b => ({ ...b }));
  }

  function loadBars() {
    try { return cleanBars(JSON.parse(localStorage.getItem(BARS_KEY))); } catch (e) {}
    return cleanBars(null);
  }

  function renderBars() {
    barsEl.innerHTML = '';
    for (const b of barSettings) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('i');
      fill.style.background = b.color;
      bar.appendChild(fill);
      barsEl.appendChild(bar);
    }
  }

  function update() {
    const text = editor.value;
    const words = (text.match(/\S+/g) || []).length;
    const chars = text.length;
    count.textContent = `${words} ${words === 1 ? 'word' : 'words'} · ${chars} chars`;

    barsEl.childNodes.forEach((bar, i) => {
      const from = i ? barSettings[i - 1].to : 0, to = barSettings[i].to;
      bar.classList.toggle('show', words >= from);
      bar.firstElementChild.style.width = Math.min(Math.max((words - from) / (to - from), 0), 1) * 100 + '%';
    });
  }

  renderBars();
  try { editor.value = localStorage.getItem(KEY) || ''; } catch (e) {}
  update();

  // --- Settings panel ---
  const settingsEl = document.getElementById('settings');
  const rowsEl = document.getElementById('rows');
  const addBtn = document.getElementById('add');
  let rows = [];   // editable copy of the settings; may be temporarily invalid while typing

  function applyRows() {
    barSettings = cleanBars(rows.map(r => ({ to: r.to, color: r.color })));
    try { localStorage.setItem(BARS_KEY, JSON.stringify(barSettings)); } catch (e) {}
    renderBars();
    update();
  }

  function renderRows() {
    rowsEl.innerHTML = '';
    rows.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span>Up to</span><input type="number" min="1" step="50" aria-label="Word count"><span>words</span>' +
        '<input type="color" aria-label="Color"><button class="remove" aria-label="Remove bar">✕</button>';
      const [num, color] = row.querySelectorAll('input');
      num.value = r.to;
      color.value = r.color;
      num.oninput = () => { r.to = num.value; applyRows(); };
      num.onchange = () => { rows = barSettings.map(b => ({ ...b })); renderRows(); };   // tidy up: sort, drop duplicates
      color.oninput = () => { r.color = color.value; applyRows(); };
      row.querySelector('.remove').onclick = () => { rows.splice(i, 1); applyRows(); renderRows(); };
      rowsEl.appendChild(row);
    });
    addBtn.disabled = rows.length >= MAX_BARS;
    rowsEl.querySelectorAll('.remove').forEach(b => b.disabled = rows.length <= 1);
  }

  function openSettings() {
    rows = barSettings.map(b => ({ ...b }));
    renderRows();
    settingsEl.classList.add('open');
  }

  function closeSettings() {
    settingsEl.classList.remove('open');
    editor.focus();
  }

  addBtn.onclick = () => {
    const last = rows[rows.length - 1];
    rows.push({ to: Math.round((+last.to || 0) + 400), color: '#c0504d' });
    applyRows();
    rows = barSettings.map(b => ({ ...b }));
    renderRows();
  };
  document.getElementById('reset').onclick = () => {
    rows = DEFAULT_BARS.map(b => ({ ...b }));
    applyRows();
    renderRows();
  };
  document.getElementById('close').onclick = closeSettings;
  document.getElementById('settings-btn').onclick = openSettings;
  settingsEl.addEventListener('click', e => { if (e.target === settingsEl) closeSettings(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && settingsEl.classList.contains('open')) closeSettings();
  });

  // --- Open / save a file on disk (File System Access API; Chromium browsers) ---
  const fileLabel = document.getElementById('file');
  const canPick = 'showOpenFilePicker' in window;
  const PICKER_TYPES = [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.txt'] } }];
  let handle = null;   // FileSystemFileHandle of the open file
  let name = '';       // name shown in the corner
  let dirty = false;

  function showFile() {
    fileLabel.textContent = name ? name + (dirty ? ' •' : '') : (dirty ? 'unsaved •' : '');
  }

  function setDirty(value) { dirty = value; showFile(); }

  async function openFile() {
    try {
      if (canPick) {
        [handle] = await window.showOpenFilePicker({ types: PICKER_TYPES });
        const file = await handle.getFile();
        name = file.name;
        editor.value = await file.text();
      } else {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.md,.markdown,.txt';
        const file = await new Promise(resolve => {
          input.onchange = () => resolve(input.files[0]);
          input.click();
        });
        if (!file) return;
        handle = null;
        name = file.name;
        editor.value = await file.text();
      }
      update();
      setDirty(false);
    } catch (e) { /* picker cancelled */ }
  }

  async function saveFile() {
    try {
      if (canPick) {
        if (!handle) {
          handle = await window.showSaveFilePicker({ suggestedName: name || 'untitled.md', types: PICKER_TYPES });
          name = handle.name;
        }
        const writable = await handle.createWritable();
        await writable.write(editor.value);
        await writable.close();
      } else {
        // No write access in this browser: download a copy instead.
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([editor.value], { type: 'text/markdown' }));
        a.download = name || 'untitled.md';
        a.click();
        URL.revokeObjectURL(a.href);
      }
      setDirty(false);
    } catch (e) { /* save cancelled */ }
  }

  // Full screen is the browser's own shortcut; just show the right one.
  document.getElementById('fullscreen-key').textContent =
    /Mac/i.test(navigator.platform) ? 'Ctrl + ⌘ + F' : 'F11';

  document.addEventListener('keydown', e => {
    if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey) return;
    const key = e.key.toLowerCase();
    if (key === 's') { e.preventDefault(); saveFile(); }
    else if (key === 'o') { e.preventDefault(); openFile(); }
  });

  window.addEventListener('beforeunload', e => {
    if (dirty) e.preventDefault();
  });

  editor.addEventListener('input', () => {
    update();
    setDirty(true);
    try { localStorage.setItem(KEY, editor.value); } catch (e) {}
    document.body.classList.add('typing');
    clearTimeout(idle);
    idle = setTimeout(() => document.body.classList.remove('typing'), 1500);
  });
</script>
</body>
</html>
